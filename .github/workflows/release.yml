name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Build native binaries
        run: mise exec -- ./tools/build-native-binaries.sh

      - name: Verify native binary checksums
        run: shasum -a 256 -c tools/native-binaries.sha256

      - name: Decode keystore
        env:
          CRYPTSYNC_KEYSTORE_BASE64: ${{ secrets.CRYPTSYNC_KEYSTORE_BASE64 }}
        run: echo "$CRYPTSYNC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release
        env:
          CRYPTSYNC_KEYSTORE: ${{ runner.temp }}/release.keystore
          CRYPTSYNC_KEYSTORE_PASSWORD: ${{ secrets.CRYPTSYNC_KEYSTORE_PASSWORD }}
          CRYPTSYNC_KEY_ALIAS: ${{ secrets.CRYPTSYNC_KEY_ALIAS }}
          CRYPTSYNC_KEY_PASSWORD: ${{ secrets.CRYPTSYNC_KEY_PASSWORD }}
        run: mise exec -- ./gradlew assembleRelease --no-configuration-cache

      - name: Build F-Droid repository
        env:
          FDROID_IMAGE: registry.gitlab.com/fdroid/docker-executable-fdroidserver:master
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASS: ${{ secrets.CRYPTSYNC_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.CRYPTSYNC_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CRYPTSYNC_KEY_ALIAS }}
        run: |
          mkdir -p fdroid/repo
          cp app/build/outputs/apk/release/*.apk fdroid/repo/
          fdroid() {
            docker run --rm \
              -v "$PWD/fdroid:/repo" \
              -v "$KEYSTORE_PATH:$KEYSTORE_PATH:ro" \
              -e KEYSTORE_PATH -e KEYSTORE_PASS -e KEY_PASS -e KEY_ALIAS \
              "$FDROID_IMAGE" "$@"
          }
          fdroid update --create-metadata --verbose
          fdroid readmeta

      - name: Stage GitHub Pages site
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp -R fdroid "$RUNNER_TEMP/pages/fdroid"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
          include-hidden-files: true

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(app/build/outputs/apk/release/*.apk)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [ ${#files[@]} -eq 0 ] || gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          fi
