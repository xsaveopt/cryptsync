services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: cryptsync
      MINIO_ROOT_PASSWORD: cryptsync123
    volumes:
      - minio-data:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 cryptsync cryptsync123; do sleep 1; done;
      mc mb -p local/cryptsync;
      mc anonymous set none local/cryptsync;
      "

volumes:
  minio-data:
